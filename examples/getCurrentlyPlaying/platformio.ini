[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_speed = 115200
lib_ldf_mode = deep
lib_extra_dirs = ../../
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    adafruit/Adafruit BusIO @ ^1.14.5
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SH110X @ ^2.1.10
